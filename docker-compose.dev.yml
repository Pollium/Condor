name: condor-dev

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: condor
      POSTGRES_PASSWORD: condor
      POSTGRES_DB: condor
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condor -d condor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6389:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    ports:
      - "9010:9000"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: condor
      RUSTFS_SECRET_KEY: condor-secret
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  redis-data:
  storage-data:
